name: Auto Format

on:
  pull_request:
    branches: [main]

# The job checks out and pushes as the org's dependency-updates App, never GITHUB_TOKEN
permissions: {}

concurrency:
  group: auto-format-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Auto Format
    runs-on: ubuntu-latest
    # Skip if:
    # - PR from fork (can't push back)
    # - Commit by github-actions[bot] (prevent infinite loop)
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    steps:
      # A format commit pushed with GITHUB_TOKEN starts no CI; the App's push does. This repo
      # alone, contents write. Minting fails when the secrets aren't available to the run.
      - name: Token to push the format commit
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPENDENCY_UPDATES_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATES_APP_KEY }}
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.token.outputs.token }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt --all

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "formatted=false" >> $GITHUB_OUTPUT
          else
            echo "formatted=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.formatted == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: auto-format code"
          git push
