name: Auto Format

on:
  pull_request:
    branches: [main]

# The job checks out and pushes with PARENT_REPO_PAT, never GITHUB_TOKEN
permissions: {}

concurrency:
  group: auto-format-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Auto Format
    runs-on: ubuntu-latest
    # Skip if:
    # - PR from fork (can't push back)
    # - Commit by github-actions[bot] (prevent infinite loop)
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    steps:
      # A push with GITHUB_TOKEN would start no CI on the format commit
      - name: Require PARENT_REPO_PAT
        env:
          PAT: ${{ secrets.PARENT_REPO_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::PARENT_REPO_PAT is not available to this run; run cargo fmt --all and push the result yourself"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PARENT_REPO_PAT }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt --all

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "formatted=false" >> $GITHUB_OUTPUT
          else
            echo "formatted=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.formatted == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: auto-format code"
          git push
