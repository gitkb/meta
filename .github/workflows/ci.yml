name: CI

# PRs and main run Test on Linux, macOS and Windows, and Integration Tests
# on Linux. On push to main, on-push-main.yml calls this before
# release-please; release.yml calls it with the macOS and Windows runners, so
# they test a release, macOS integration included, before its assets are
# uploaded. macOS and Windows use GitHub-hosted runners (free: meta is public).
on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      test_os:
        description: JSON list of runners for Test
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      integration_os:
        description: JSON list of runners for Integration Tests
        type: string
        default: '["ubuntu-latest"]'
      tests_only:
        description: Skip Clippy, Check Each Crate and Format
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a PR cancels its older run. A caller's runs are never
# cancelled: github.workflow is the caller's name there, and the group is
# keyed by commit.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # inputs is empty on pull_request, hence the fallback
        os: ${{ fromJSON(inputs.test_os || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "test-${{ matrix.os }}"

      # The docs and hints tests run meta's plugins and the example plugin:
      # cargo test builds a package's binaries only for its own tests
      - name: Build binaries and examples
        run: cargo build --workspace --bins --examples --locked

      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast

  clippy:
    name: Clippy
    if: ${{ !inputs.tests_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "clippy"

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  crates:
    name: Check Each Crate
    if: ${{ !inputs.tests_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "crates"

      # A workspace build unifies features across crates, which can hide a
      # crate that only compiles with its siblings' features
      - name: Check each crate on its own
        run: |
          set -o pipefail
          pkgs=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')
          [ -n "$pkgs" ]
          for p in $pkgs; do
            echo "::group::$p"
            cargo check -p "$p" --all-targets --locked
            echo "::endgroup::"
          done

  integration:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.integration_os || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "integration-${{ matrix.os }}"

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Install bats
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y bats jq python3
          else
            brew install bats-core
          fi
        shell: bash

      - name: Verify binaries
        run: |
          ls -lh target/debug/meta target/debug/meta-git
          ./target/debug/meta --version
          ./target/debug/meta-git --meta-plugin-info | jq .name
        shell: bash

      - name: Run integration tests
        run: META_BIN_DIR="$PWD/target/debug" bats tests/*.bats
        shell: bash

  format:
    name: Format
    if: ${{ !inputs.tests_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # The check the org requires on main (`gate / CI gate`): it passes only
  # when every job above succeeded on every runner (a failed, cancelled or
  # skipped one fails it). `if: always()` makes it report after a failure; a
  # skipped call reports only as `gate`. release.yml's tests_only run skips
  # Clippy, Check Each Crate and Format on purpose. meta is public, so it
  # calls its own copy of the shared gate (ci-gate.yml says why).
  gate:
    if: always()
    needs: [test, clippy, crates, integration, format]
    uses: ./.github/workflows/ci-gate.yml
    with:
      needs: ${{ toJSON(needs) }}
      allowed-skips: ${{ inputs.tests_only && 'clippy crates format' || '' }}
