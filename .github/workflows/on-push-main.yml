name: On Push to Main

on:
  push:
    branches:
      - main

# release-please acts with PARENT_REPO_PAT, not GITHUB_TOKEN
permissions:
  contents: read

jobs:
  # Run quality checks first
  quality:
    uses: ./.github/workflows/ci.yml

  # Create release PR or release on merge. The tag it creates (with the PAT)
  # starts release.yml.
  release-please:
    name: Release Please
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release Please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.PARENT_REPO_PAT }}
          # Use manifest mode to track version in VERSION file
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
