name: Release

# release-please creates the tag with PARENT_REPO_PAT, so its push starts this
# workflow, and every job checks out the tag. A PR that changes this file, or a
# manual run, builds and checks the archives the same way and releases nothing.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/programs.py
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: meta-darwin-x64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: meta-darwin-arm64.tar.gz
          # Linux builds run on Homebrew's Linux floor (the homebrew/brew
          # image is Ubuntu 22.04, glibc 2.35): a binary needs the glibc it
          # was linked against, and ubuntu-latest's is newer
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            asset_name: meta-linux-x64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            asset_name: meta-linux-arm64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: meta-windows-x64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} --workspace --bins --locked

      # The archive holds exactly the workspace's [[bin]] programs
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: python3 scripts/programs.py package target/${{ matrix.target }}/release dist ${{ matrix.asset_name }}

      # Homebrew's floor, so a runner image change can't ship binaries that
      # fail with "version `GLIBC_2.xx' not found" on users' machines
      - name: Check the glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          floor=2.35
          for bin in dist/*; do
            need=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -n 1)
            if [ -z "$need" ]; then
              echo "::error::$bin: no GLIBC symbol versions found"
              exit 1
            fi
            echo "$bin needs glibc $need (floor $floor)"
            if [ "$(printf '%s\n' "$need" "$floor" | sort -V | tail -n 1)" != "$floor" ]; then
              echo "::error::$bin needs glibc $need, above Homebrew's floor $floor"
              exit 1
            fi
          done

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: python scripts/programs.py package target/${{ matrix.target }}/release dist ${{ matrix.asset_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  release:
    name: Create Release
    needs: build
    # A PR or manual run stops after the build; the jobs below need this one
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload the assets to the release
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release/ \;
          cd release
          cat *.sha256 > checksums.txt

      - name: Upload to existing release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-discord:
    name: Notify Discord
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    # A failed Discord post must not block downstream consumers of the release
    # (e.g. the homebrew tap update).
    continue-on-error: true
    steps:
      - name: Check webhook configured
        id: check
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Discord webhook not configured, skipping notification"
          fi

      - name: Post to Discord
        if: steps.check.outputs.skip != 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
        run: |
          TAG="${{ needs.release.outputs.tag }}"

          PAYLOAD=$(jq -n \
            --arg title "meta $TAG Released" \
            --arg desc "A new version of meta, the multi-repo workspace CLI, is available." \
            --arg install_brew 'brew install gitkb/tap/meta-cli' \
            --arg url "https://github.com/gitkb/meta/releases/tag/$TAG" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 3066993,
                fields: [
                  {
                    name: "Install via Homebrew",
                    value: ("```sh\n" + $install_brew + "\n```")
                  }
                ]
              }]
            }')

          # Bound the request and capture curl exit code separately so
          # pre-HTTP failures (DNS, connection refused, timeout) are logged
          # distinctly from HTTP-level failures.
          set +e
          HTTP_STATUS=$(curl -sS -o /tmp/discord_response.txt -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL")
          CURL_EXIT=$?
          set -e

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::warning::Discord notification request failed before HTTP response (curl exit $CURL_EXIT)"
            cat /tmp/discord_response.txt 2>/dev/null || true
            exit 1
          elif [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Discord notification sent successfully (HTTP $HTTP_STATUS)"
          else
            echo "::warning::Discord notification failed (HTTP $HTTP_STATUS)"
            cat /tmp/discord_response.txt
            exit 1
          fi

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    # Only update on non-prerelease tags
    if: ${{ !contains(needs.release.outputs.tag, '-') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version
        id: version
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT
        env:
          TAG: ${{ needs.release.outputs.tag }}

      # It installs what the archives hold
      - name: Generate Homebrew formula
        run: python3 scripts/programs.py formula "${{ steps.version.outputs.version }}" artifacts/*/meta-*.tar.gz > meta-cli.rb

      - name: Push to Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="update-meta-cli-${VERSION}"

          gh auth setup-git
          gh repo clone gitkb/homebrew-tap tap
          mkdir -p tap/Formula
          cp meta-cli.rb tap/Formula/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/meta-cli.rb
          if ! git diff --cached --quiet; then
            git checkout -b "$BRANCH"
            git commit -m "Update meta-cli to v${VERSION}"
            # Force push in case branch exists from a previous failed run
            git push -f -u origin "$BRANCH"
            # Create PR only if one doesn't already exist
            if ! gh pr view "$BRANCH" --repo gitkb/homebrew-tap &>/dev/null; then
              gh pr create \
                --title "Update meta-cli to v${VERSION}" \
                --body "Automated formula update from meta release v${VERSION}." \
                --repo gitkb/homebrew-tap
            fi
            gh pr merge "$BRANCH" \
              --auto --squash \
              --repo gitkb/homebrew-tap || echo "Auto-merge setup failed (may require approvals)"
          else
            echo "Formula unchanged, skipping commit"
          fi


  # Dependents that pin meta's releases get dep-update with this version once
  # the release's assets are uploaded. meta is public and can't call the
  # private gitkb/workflows, so this sends the dispatch itself: one per
  # dependent that gitkb/workflows' dependents.yml lists with a release-pin
  # entry for meta. Keep the two in step; its daily check fails when a listed
  # one is missing here. Only this repo, and only a published release.
  notify-release-pins:
    name: Notify release pins
    needs: release
    if: github.repository == 'gitkb/meta'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send dep-update with the version
        env:
          GH_TOKEN: ${{ secrets.PARENT_REPO_PAT }}
          TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::${TAG} isn't vMAJOR.MINOR.PATCH; release pins take only those, so nothing is sent."
            exit 0
          fi
          # The release's real state, not its tag's shape: a v1.2.3 can be a draft or marked prerelease.
          state="$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq 'if .draft then "draft" elif .prerelease then "prerelease" else "published" end')"
          if [[ "$state" != published ]]; then
            echo "::notice::${TAG} is a ${state} release; release pins move only to published ones, so nothing is sent."
            exit 0
          fi
          sha="$(gh api "repos/${REPO}/commits/${TAG}" --jq .sha)"
          payload="$(jq -n --arg repo "$REPO" --arg sha "$sha" --arg version "${TAG#v}" \
            '{event_type: "dep-update", client_payload: {repo: $repo, sha: $sha, version: $version}}')"
          gh api --method POST repos/gitkb/atc-sandbox/dispatches --input - <<<"$payload" >/dev/null
          echo "Sent dep-update ${REPO} ${TAG} to gitkb/atc-sandbox"
