[workspace]
members = [
    "loop_cli",
    "loop_lib",
    "meta_cli",
    "meta_core",
    "meta_git_cli",
    "meta_mcp",
    "meta_plugin",
    "meta_rust_cli",
]
exclude = ["agent"]
resolver = "2"

[workspace.package]
version = "0.2.22"
edition = "2021"
license = "MIT"
repository = "https://github.com/gitkb/meta"

[workspace.dependencies]
loop_lib = { path = "loop_lib" }
meta_core = { path = "meta_core" }
meta_plugin = { path = "meta_plugin" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = "4.3"
colored = "2"
dirs = "5"
env_logger = "0.10"
indexmap = "2"
indicatif = "0.17"
log = "0.4"
rayon = "1.7"
rustix = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
shlex = "1.3"
signal-hook = "0.4"
tempfile = "3.3"

[workspace.lints.rust]
unused_must_use = "forbid"
unconditional_recursion = "forbid"
unsafe_code = "forbid"

# deny, not forbid: clap's derive allows whole clippy groups on the code it
# generates, which forbid would reject
[workspace.lints.clippy]
suspicious = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
read_zero_byte_vec = "deny"
debug_assert_with_mut_call = "deny"
unchecked_time_subtraction = "deny"
unused_result_ok = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
cast_lossless = "deny"
large_stack_arrays = "deny"
panic = "deny"
unreachable = "deny"
# output goes through meta_plugin::out, exits through meta_plugin::exit
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
string_slice = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
significant_drop_tightening = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"
