[package]
name = "loop_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Run commands across multiple directories"

[dependencies]
meta_plugin = { workspace = true, features = ["parse"] }
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
colored.workspace = true
loop_lib.workspace = true

[dev-dependencies]
meta_plugin = { workspace = true, features = ["testing-git"] }
serde_json.workspace = true

[[bin]]
name = "loop"
path = "src/main.rs"

[lints]
workspace = true
