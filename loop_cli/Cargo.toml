[package]
name = "loop_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Run commands across multiple directories"

[dependencies]
anyhow = "1.0"
clap = { version = "4.3", features = ["derive"] }
colored = "2.0"
loop_lib = { path = "../loop_lib" }
# Any 0.x, as for loop_lib
meta_core = { path = "../meta_core", version = "<1" }

[[bin]]
name = "loop"
path = "src/main.rs"

[lints]
workspace = true
