[package]
name = "meta_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared infrastructure for ~/.meta/ directory management and atomic JSON store"

[dependencies]
anyhow = "1.0"
clap = "4.3"
colored = "2"
console = "0.15"
shlex = "1.3"
strsim = "0.11"
dirs = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "termios"] }
signal-hook = { version = "0.4", features = ["extended-siginfo"] }

[dev-dependencies]
tempfile = "3.3"

[lints]
workspace = true
