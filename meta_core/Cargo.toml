[package]
name = "meta_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The workspace domain meta and its plugins share: config, repo selection, worktree sets, the dependency graph, and the processes meta starts"

[dependencies]
anyhow.workspace = true
clap.workspace = true
colored.workspace = true
console = "0.15"
shlex.workspace = true
strsim = "0.11"
dirs.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
walkdir = "2.3"

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process", "termios"] }
signal-hook = { workspace = true, features = ["extended-siginfo"] }

[dev-dependencies]
meta_test_support.workspace = true
tempfile.workspace = true

[lints]
workspace = true
