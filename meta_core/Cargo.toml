[package]
name = "meta_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared infrastructure for ~/.meta/ directory management and atomic JSON store"

[dependencies]
anyhow = "1.0"
dirs = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.3"
