[package]
name = "meta_git_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Git plugin for meta CLI"

[[bin]]
name = "meta-git"
path = "src/main.rs"

[lib]
name = "meta_git_cli"
path = "src/lib.rs"

[dependencies]
tempfile.workspace = true
meta_plugin_protocol.workspace = true
meta_core.workspace = true
meta_git_lib = { path = "../meta_git_lib" }
loop_lib.workspace = true
clap = { workspace = true, features = ["derive"] }
anyhow.workspace = true
serde.workspace = true
rayon.workspace = true
serde_json.workspace = true
chrono.workspace = true
indicatif.workspace = true
log.workspace = true
colored.workspace = true
indexmap.workspace = true
dirs.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process", "termios"] }

[dev-dependencies]
meta_test_support.workspace = true
shlex.workspace = true

[lints]
workspace = true
