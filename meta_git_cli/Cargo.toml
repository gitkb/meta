[package]
name = "meta_git_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Git plugin for meta CLI"

[[bin]]
name = "meta-git"
path = "src/main.rs"

[lib]
name = "meta_git_cli"
path = "src/lib.rs"

[dependencies]
tempfile = "3.3"
meta_plugin_protocol = { path = "../meta_plugin_protocol" }
meta_core = { path = "../meta_core" }
meta_git_lib = { path = "../meta_git_lib" }
meta_cli = { path = "../meta_cli", package = "meta" }
loop_lib = { path = "../loop_lib" }
clap = { version = "4.3", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.7"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
console = "0.15"
log = "0.4"
colored = "2"
indexmap = "2"
dirs = "5"

[dev-dependencies]
serial_test = "3.0"
shlex = "1"

[lints]
workspace = true
