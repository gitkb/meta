[package]
name = "meta-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "MCP server for meta - exposes multi-repo operations to AI tools"

[[bin]]
name = "meta-mcp"
path = "src/main.rs"

[dependencies]
meta_plugin = { workspace = true, features = ["parse", "client"] }
meta_core.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
schemars = "1.2"
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[dev-dependencies]
meta_plugin = { workspace = true, features = ["testing-git"] }

[lints]
workspace = true
