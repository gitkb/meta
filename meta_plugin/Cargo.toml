[package]
name = "meta_plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The SDK for meta plugins: the plugin protocol, a plugin's runtime (exit codes, output, escaping), the one process owner, and a test kit"
# pre-release: plugins depend on it by git, and nothing is published
publish = false

[features]
default = ["process"]
# the one owner of the processes a meta program starts
process = ["dep:rustix", "dep:signal-hook", "dep:win32job"]
# temporary: clap parsing of a plugin's arguments and the tip for one of
# meta's options typed after the command, until the host parses for plugins
parse = ["dep:clap", "dep:strsim"]
# reading manifests (`meta-plugin.toml`)
manifest = ["dep:toml"]
# a manifest's options as a command line
parser = ["manifest", "dep:clap"]
# generated request types, in a plugin's build script
build = ["manifest"]
# calling meta back (`meta --json …`) from a program meta started
client = ["process"]
# worktree sets for any provider: owner files, leases, hooks
sets = ["dep:same-file"]
# a sandbox and workspace builder for plugin tests
testing = ["process", "dep:tempfile"]
# the same, with git repositories in the workspace
testing-git = ["testing"]

[dependencies]
anyhow.workspace = true
base64 = "0.22"
colored.workspace = true
console = "0.15"
env_logger.workspace = true
indexmap = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
clap = { workspace = true, features = ["string"], optional = true }
strsim = { version = "0.11", optional = true }
tempfile = { workspace = true, optional = true }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process", "termios"], optional = true }
signal-hook = { workspace = true, features = ["extended-siginfo"], optional = true }

[target.'cfg(windows)'.dependencies]
win32job = { version = "2", optional = true }

[target.'cfg(not(unix))'.dependencies]
same-file = { version = "1", optional = true }

[dev-dependencies]
meta_plugin = { path = ".", features = ["parse", "parser", "build", "sets", "client", "testing-git"] }

[lints]
workspace = true
