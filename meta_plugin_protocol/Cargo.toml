[package]
name = "meta_plugin_protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared plugin protocol types for meta subprocess plugins"

[dependencies]
# Any 0.x, as for loop_lib; release.yml pins it and publishes meta_core first
meta_core = { path = "../meta_core", version = "<1" }
clap = "4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
env_logger = "0.10"
indexmap = { version = "2", features = ["serde"] }

[lints]
workspace = true
