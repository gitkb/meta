[package]
name = "meta_project_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Project management plugin for meta CLI to sync and update project repositories"

[[bin]]
name = "meta-project"
path = "src/main.rs"

[lib]
name = "meta_project_cli"
path = "src/lib.rs"

[dependencies]
meta_core.workspace = true
shlex.workspace = true
meta_plugin = { workspace = true, features = ["parse"] }
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true

[dev-dependencies]
meta_plugin = { workspace = true, features = ["testing-git"] }

[lints]
workspace = true
