[package]
name = "meta_rust_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Rust plugin for meta CLI to run any cargo command across Rust repos"

[[bin]]
name = "meta-cargo"
path = "src/main.rs"

[lib]
name = "meta_rust_cli"
path = "src/lib.rs"

[dependencies]
meta_plugin = { workspace = true, features = ["parse"] }
indexmap.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
